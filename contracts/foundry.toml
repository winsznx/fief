[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# The fixtures are the arbiter between Solidity and the reference model
# (PRD v2 §11), so the test suite must be able to read them.
fs_permissions = [{ access = "read", path = "../packages/reference/fixtures" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
