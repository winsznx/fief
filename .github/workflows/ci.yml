name: ci

# Runs the exact commands SETUP.md tells a judge to run. If the documented
# path is red, the submission is red, so there is no separate "CI variant"
# of these commands to drift away from the docs.

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  reference:
    name: reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: packages/reference/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: packages/reference
      - run: pnpm verify
        working-directory: packages/reference
      # The fixtures are the arbiter between Solidity and TypeScript, so a
      # regenerated fixture that differs from the committed one is a real
      # behavioural change and must not pass silently.
      - run: pnpm fixtures && git diff --exit-code fixtures/
        working-directory: packages/reference

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: an unpinned foundry-toolchain resolves to whatever forge shipped
      # that day, and 1.8.1 changed gas metering enough to blow the §13 reveal
      # budget test (235849 -> 297505 gas, same code, same fixtures) without
      # any change on this side. Bump deliberately, not by drift.
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
        working-directory: packages/reference
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
      - run: forge build --sizes
        working-directory: contracts

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # lint, typecheck, copy-guard, contrast, tests — the documented command.
      - run: pnpm verify
        working-directory: web
      - run: pnpm build
        working-directory: web

  runtime:
    name: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: runtime/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: runtime
      - run: pnpm verify
        working-directory: runtime

  claims:
    name: claims ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Fails if the README asserts an address, transaction or percentage the
      # ledger does not back. A README drifting ahead of its evidence is the
      # exact failure this product exists to prevent.
      - run: node scripts/check-claims.mjs

  no-generated-output:
    name: no generated output committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 128 .open-next files were once committed, which made the documented
      # `pnpm verify` exit non-zero for anyone who ran it.
      - name: assert build artifacts are untracked
        run: |
          BAD=$(git ls-files | grep -E '^(web/\.open-next/|web/\.wrangler/|contracts/out/|contracts/cache/|.*/node_modules/)' || true)
          if [ -n "$BAD" ]; then echo "generated files are tracked:"; echo "$BAD" | head -20; exit 1; fi
          echo "clean"
